name: iOS sideload IPA

# Builds the public sideload IPA with tools/build_ios_release.sh on a hosted
# Mac, following docs/IOS_RELEASE_BUILD.md and docs/IOS_GAME_STARTUP.md. The
# build steps are in build-ios-ipa-build.yml. A cancelled run can be
# restarted with Re-run jobs on its page, or from the Actions tab with Run
# workflow.

on:
  push:
    branches: [m3-ipad-fixes]
    paths:
      - '.github/workflows/build-ios-ipa.yml'
      - '.github/workflows/build-ios-ipa-build.yml'
      - 'ios/**'
      - 'tools/package_ios_ipa.sh'
      - 'tools/build_ios_release.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

# Both jobs use the same Xcode, named by its versioned path so a change of
# the images' default Xcode cannot make them differ: Xcode 26.6 with the
# iOS 26.5 SDK is on both the Apple silicon and the Intel macOS 26 images.
jobs:
  macos26:
    name: macOS 26 Apple silicon (Xcode 26.6)
    uses: ./.github/workflows/build-ios-ipa-build.yml
    with:
      runner: macos-26
      xcode: /Applications/Xcode_26.6.app

  # When GitHub has no Apple silicon macOS 26 machine to give (the job is
  # dropped after about 15 minutes in the queue), build on an Intel macOS 26
  # machine, a separate pool, with the same Xcode. The app is cross-compiled
  # for arm64 either way; only the build machine differs, and it is slower.
  # It does not run when the first build started and failed, or when the run
  # was cancelled.
  macos26-intel-fallback:
    name: macOS 26 Intel fallback (Xcode 26.6)
    needs: macos26
    if: ${{ !cancelled() && needs.macos26.outputs.started != 'true' }}
    uses: ./.github/workflows/build-ios-ipa-build.yml
    with:
      runner: macos-26-intel
      xcode: /Applications/Xcode_26.6.app
